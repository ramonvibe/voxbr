[project]
name = "voxbr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[openai,silero,turn-detector]==1.8.10",
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
